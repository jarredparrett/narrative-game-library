[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-game-library"
version = "0.10.0"
description = "Deterministic narrative game building with human-governed hill-climb lineage."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pypdf>=5,<7",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
forge = [
  "verismill @ git+https://github.com/jarredparrett/verismill-lean.git@c2b02fdf2faa28ac869dafcd119bf65d1a32e87c",
  "mattermill @ git+https://github.com/jarredparrett/verismill-lean.git@c2b02fdf2faa28ac869dafcd119bf65d1a32e87c#subdirectory=libs/mattermill",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
narrative-game-stage0 = "narrative_game.stage0_fixture:main"
narrative-game-example = "narrative_game.stage5_fixture:main"
narrative-game-climb-example = "narrative_game.stage6_fixture:main"
narrative-game-climb-prepare = "narrative_game.stage7_experiment:main"
narrative-game-climb-measure = "narrative_game.stage7_experiment:measure_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
narrative_game = [
  "examples/ashwood-ledger/*.json",
  "examples/ashwood-ledger/content/*",
  "examples/vanished-ledger/*.json",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
