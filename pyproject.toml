[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-game-library"
version = "0.30.0"
description = "Deterministic narrative game building with agentic, inspectable hill-climb lineage."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pypdf>=5,<7",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
analysis = [
  "openai>=2,<3",
]
forge = [
  "verismill @ git+https://github.com/jarredparrett/verismill-lean.git@94a88e73a82ec442496fd4d7f9550454f9c60caf",
  "mattermill @ git+https://github.com/jarredparrett/verismill-lean.git@94a88e73a82ec442496fd4d7f9550454f9c60caf#subdirectory=libs/mattermill",
]
harbor = [
  "harbor>=0.20; python_version >= '3.12'",
]
prime = [
  "verifiers==0.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "verifiers==0.3.0",
]

[project.scripts]
narrative-game-stage0 = "narrative_game.stage0_fixture:main"
narrative-game-example = "narrative_game.stage5_fixture:main"
narrative-game-climb-example = "narrative_game.stage6_fixture:main"
narrative-game-climb-prepare = "narrative_game.stage7_experiment:main"
narrative-game-climb-measure = "narrative_game.stage7_experiment:measure_main"
narrative-game-experience = "narrative_game.stage11_fixture:main"
narrative-game-character-example = "narrative_game.stage11_character_fixture:main"
narrative-game-playtest-prepare = "narrative_game.stage11_playtest_fixture:main"
narrative-game-playtest-record = "narrative_game.playtest.ingestion:main"
narrative-game-playtest-session = "narrative_game.playtest.session_recording:main"
narrative-game-playtest-model-baseline = "narrative_game.playtest.model_baseline:main"
narrative-game-playtest-review = "narrative_game.playtest.review:main"
narrative-game-codex-judge-driver = "narrative_game.playtest.codex_driver:main"
narrative-game-release-qualify = "narrative_game.stage12_qualification:main"
narrative-game-harbor-verify = "narrative_game.adapters.harbor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
narrative_game = [
  "examples/ashwood-ledger/*.json",
  "examples/ashwood-ledger/content/*",
  "examples/vanished-ledger/*.json",
  "examples/winter-observatory/*.json",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
